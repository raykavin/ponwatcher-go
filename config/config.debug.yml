application:
  name: PONWatcher
  description: Monitoramento Óptico Inteligente
  version: 0.0.1
  logger_level: debug
  
  web:
    listen: 3000
    ssl_enabled: false
    ssl_cert: 
    ssl_key:
    no_route_to: https://example.com
    allow_origins:
      - "*"
    allow_methods:
      - GET
    allow_headers:
      - Content-Type 
      - Content-Length

services:
  unm:
    host: {{UNM_HOST}}
    port: {{UNM_PORT}}
    username: {{UNM_API_USERNAME}}
    password: {{UNM_API_PASSWORD}}

